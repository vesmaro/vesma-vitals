[project]
name = "mnemos-vitals"
version = "0.0.1"
description = "Honest measurement methodology and instrumentation for the Mnemos memory server: health contour for every function, value proof for promised functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_vitals"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S608",  # table names come from the born-final schema constant, not user input
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts ARE the test contract
